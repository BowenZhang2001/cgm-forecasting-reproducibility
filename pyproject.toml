[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgm-forecasting-reproducibility"
version = "0.1.0"
description = "Reproduction code for the CGM forecasting study"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "pyarrow>=18,<21",
    "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cgm-reproduce = "cgm_pipeline.reproduce:main"
